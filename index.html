<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e15">
<title>솔라리아 제국 기록 보관소</title>
<meta name="description" content="북부 대공에게 구해진 당신, 그리고 당신만을 향하는 마물들. 솔라리아 제국 시뮬레이션 세계관 기록 보관소.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e15; --bg1:#10141e; --bg2:#151b28; --line:rgba(201,169,79,.28); --line2:rgba(201,169,79,.55);
  --gold:#c9a94f; --gold-hi:#f0d98a; --ink:#ece3cb; --muted:#a99d80; --dim:#6f6652;
  --paper:#e8dcbd; --paper2:#d9c9a2; --paper-ink:#2b2216; --paper-dim:#6b5a40; --seal:#b3352a; --seal-hi:#ff6a58; --rift:#9c7cff;
  --serif:'Noto Serif KR',serif; --sans:'Noto Sans KR',system-ui,sans-serif; --latin:'Cinzel',serif;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.75;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px)}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(ellipse 80% 50% at 50% -10%,rgba(201,169,79,.10),transparent 70%),
  radial-gradient(ellipse 60% 40% at 100% 100%,rgba(70,90,140,.10),transparent 70%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.latin{font-family:var(--latin);letter-spacing:.32em;font-size:11px;color:var(--gold)}
.ui{font-family:var(--sans)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(11,14,21,.78);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;height:56px;padding:0 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mk{width:26px;height:26px;position:relative;flex:none}
.brand .mk:before{content:"";position:absolute;inset:4px;transform:rotate(45deg);border:1px solid var(--gold)}
.brand .mk:after{content:"";position:absolute;inset:10px;transform:rotate(45deg);background:var(--gold)}
.brand b{display:block;font-family:var(--latin);font-weight:600;font-size:12px;letter-spacing:.28em;color:var(--gold-hi);line-height:1.2}
.brand small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--muted);letter-spacing:.18em;line-height:1.3}
.top nav{margin-left:auto;display:flex;gap:4px}
.top nav a{font-family:var(--sans);font-size:13px;letter-spacing:.14em;padding:8px 14px;color:var(--muted);position:relative}
.top nav a.on{color:var(--gold-hi)}
.top nav a.on:after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:1px;background:var(--gold)}

/* ---------- bottom nav (mobile) ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:none;background:linear-gradient(180deg,rgba(16,20,30,.92),rgba(9,11,17,.98));border-top:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-family:var(--sans);font-size:11px;letter-spacing:.12em;color:var(--dim);position:relative}
.bnav a.on{color:var(--gold-hi)}
.bnav a.on:before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.ic{width:20px;height:20px;position:relative;display:block}
.ic-map:before{content:"";position:absolute;inset:3px;border:1.5px solid currentColor;transform:rotate(45deg)}
.ic-map:after{content:"";position:absolute;left:8px;top:8px;width:4px;height:4px;background:currentColor;transform:rotate(45deg)}
.ic-ppl:before{content:"";position:absolute;left:6px;top:1px;width:8px;height:8px;border:1.5px solid currentColor;border-radius:50%}
.ic-ppl:after{content:"";position:absolute;left:2px;bottom:1px;width:16px;height:8px;border:1.5px solid currentColor;border-bottom:0;border-radius:9px 9px 0 0}
.ic-seal:before{content:"";position:absolute;inset:1px;border:1.5px solid currentColor;border-radius:50%}
.ic-seal:after{content:"";position:absolute;left:6px;top:6px;width:8px;height:8px;background:currentColor;transform:rotate(45deg)}
@media (max-width:720px){.top nav{display:none}.bnav{display:flex}}
@media (min-width:721px){body{padding-bottom:0}}

/* ---------- page ---------- */
main{max-width:1080px;margin:0 auto;padding:0 16px}
.page{animation:pageIn .45s cubic-bezier(.2,.7,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec{margin:44px 0}
.sh{display:flex;align-items:baseline;gap:12px;margin:0 0 16px}
.sh .n{font-family:var(--latin);font-size:12px;color:var(--gold);letter-spacing:.2em}
.sh h2{margin:0;font-size:19px;font-weight:700;letter-spacing:.14em;color:#f4ead0}
.sh .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent);align-self:center}
.sh .more{font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:.1em}
.back{display:inline-flex;align-items:center;gap:8px;margin:18px 0 0;font-family:var(--sans);font-size:12.5px;letter-spacing:.14em;color:var(--muted)}
.back:before{content:"";width:7px;height:7px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg)}
.back:hover{color:var(--gold-hi)}

/* angled panel (game ui) */
.cut{--c:12px;clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}

/* ---------- hero (home) ---------- */
.hero{position:relative;text-align:center;padding:56px 0 8px}
.hero h1{margin:14px 0 4px;font-size:clamp(34px,8vw,58px);font-weight:900;letter-spacing:.14em;color:#f8efd7;text-shadow:0 0 30px rgba(240,217,138,.16)}
.hero .sub{font-family:var(--latin);font-size:12px;letter-spacing:.42em;color:var(--muted)}
.orn{display:flex;align-items:center;gap:10px;max-width:420px;margin:24px auto}
.orn:before,.orn:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn:after{background:linear-gradient(270deg,transparent,var(--gold))}
.orn i{width:7px;height:7px;transform:rotate(45deg);background:var(--gold)}
.hook{max-width:520px;margin:0 auto;font-size:15.5px}
.hook p{margin:0 0 10px}
.hook .hi{color:var(--gold-hi)}

/* ---------- map ---------- */
.frame{max-width:1060px;margin:0 auto;position:relative;padding:10px;border:1px solid #8c733a;background:linear-gradient(160deg,#181c28,#0d1017);box-shadow:0 0 0 3px #0d1017,0 0 0 4px #4a3d1f,0 18px 40px rgba(0,0,0,.6)}
.frame .cn{position:absolute;color:var(--gold);font-size:9px;line-height:1}
.map{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;border:1px solid rgba(201,169,79,.6);background:repeating-radial-gradient(circle at 50% 50%,rgba(231,200,115,.06) 0 1px,transparent 1px 18px),radial-gradient(circle at 50% 45%,#1c2a38,#0c141c 75%);box-shadow:inset 0 0 30px rgba(0,0,0,.75)}
.rg{position:absolute;inset:0;pointer-events:none;filter:drop-shadow(0 0 .6px rgba(240,217,138,.9));transition:filter .3s}
.shp{position:absolute;inset:0;pointer-events:auto;cursor:pointer;transition:filter .3s}
.map .rg.hov{filter:drop-shadow(0 0 1.2px #f6e3a0) drop-shadow(0 0 9px rgba(240,217,138,.5))}
.map .rg.hov .shp{filter:brightness(1.12)}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 0% 50%,rgba(150,80,255,.55),transparent 22%)}
.fis{position:absolute;inset:0;background:#05050a;cursor:pointer;clip-path:polygon(0 0,7% 0,4.5% 12%,8.5% 26%,5% 42%,9% 58%,5.5% 74%,8% 88%,6% 100%,0 100%)}
.rl{position:absolute;left:3.5%;top:50%;transform:translate(-50%,-50%);color:#c9a4ff;font-family:var(--sans);font-size:clamp(8px,1.4vw,11px);letter-spacing:3px;writing-mode:vertical-rl;white-space:nowrap;text-shadow:0 0 6px #9a5cff;pointer-events:none}
.lb{position:absolute;transform:translate(-50%,-50%);font-family:var(--sans);font-size:clamp(10px,2vw,14px);letter-spacing:.35em;font-weight:700;pointer-events:none}
.lb.sd{text-shadow:0 1px 2px rgba(0,0,0,.7)}
.ms{position:absolute;width:10px;height:10px;transform:translate(-50%,-50%) rotate(45deg);border:1px solid rgba(240,217,138,.7);pointer-events:none}
.pin{position:absolute;left:62%;top:19%;pointer-events:none}
.pin b{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd66b);box-shadow:0 0 10px 3px rgba(255,214,107,.85)}
.pin s{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,235,160,.6);animation:ping 2.6s ease-out infinite}
.pin em{position:absolute;left:12px;top:-10px;white-space:nowrap;font-style:normal;font-family:var(--sans);font-size:11px;color:var(--gold-hi);letter-spacing:.1em;text-shadow:0 1px 3px #000}
@keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
.compass{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(240,217,138,.55);background:rgba(10,14,20,.6);pointer-events:none}
.compass:before{content:"";position:absolute;left:18.5px;top:4px;width:1px;height:28px;background:rgba(240,217,138,.7)}
.compass:after{content:"";position:absolute;top:18.5px;left:4px;height:1px;width:28px;background:rgba(240,217,138,.7)}
.compass i{position:absolute;left:0;top:1px;width:100%;text-align:center;font-size:7px;color:#f0d98a;font-style:normal;line-height:8px}
.maphint{margin:12px 0 0;text-align:center;font-family:var(--sans);font-size:12px;color:var(--dim);letter-spacing:.14em}

/* ---------- region cards ---------- */
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.rcard{position:relative;display:block;padding:18px 18px 16px 22px;background:linear-gradient(135deg,var(--bg2),var(--bg1));border:1px solid var(--line);overflow:hidden;transition:transform .25s,border-color .25s}
.rcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rc)}
.rcard:after{content:attr(data-l);position:absolute;right:-6px;bottom:-14px;font-family:var(--latin);font-size:46px;font-weight:700;letter-spacing:.06em;color:var(--rc);opacity:.06;white-space:nowrap}
.rcard>*{position:relative;z-index:1}.rcard:after{z-index:0}
.rcard:hover{transform:translateY(-2px);border-color:var(--line2)}
.rcard .latin{color:var(--rc);font-size:10px}
.rcard h3{margin:4px 0 2px;font-size:18px;color:#f4ead0}
.rcard h3 small{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.rcard p{margin:6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.6}
.rcard .go{position:absolute;right:16px;top:18px;width:8px;height:8px;border-right:1.5px solid var(--rc);border-top:1.5px solid var(--rc);transform:rotate(45deg)}
.rcard.sealed{background:linear-gradient(135deg,#140f22,#0c0a14)}
@media (max-width:560px){.rgrid{grid-template-columns:1fr}}

/* entry tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:block;padding:20px;border:1px solid var(--line);background:linear-gradient(160deg,#171d2b,#0f131c);min-height:120px;overflow:hidden}
.tile .latin{font-size:10px}
.tile h3{margin:6px 0 4px;font-size:18px;color:#f4ead0}
.tile p{margin:0;font-size:13px;color:var(--muted)}
.tile .deco{position:absolute;right:18px;bottom:16px;width:44px;height:44px;opacity:.5}
.tile .deco.d1:before{content:"";position:absolute;inset:6px;border:1px solid var(--gold);transform:rotate(45deg)}
.tile .deco.d1:after{content:"";position:absolute;inset:16px;background:var(--gold);transform:rotate(45deg)}
.tile .deco.d2{border-radius:50%;border:1px solid var(--seal-hi);box-shadow:0 0 16px rgba(255,90,70,.35)}
.tile .deco.d2:after{content:"";position:absolute;inset:14px;background:var(--seal-hi);transform:rotate(45deg)}

/* ---------- region page ---------- */
.rhero{position:relative;margin:0 -16px;padding:34px 16px 30px;overflow:hidden;border-bottom:1px solid var(--line)}
.rhero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 22%,transparent),transparent 85%)}
.rhero .bigl{position:absolute;right:-10px;top:4px;font-family:var(--latin);font-weight:700;font-size:clamp(54px,14vw,120px);letter-spacing:.04em;color:var(--rc);opacity:.10;white-space:nowrap;pointer-events:none}
.rhero .in{position:relative;max-width:1080px;margin:0 auto}
.rhero .latin{color:var(--rc)}
.rhero h1{margin:6px 0 0;font-size:clamp(28px,6vw,40px);font-weight:900;letter-spacing:.08em;color:#f8efd7}
.rhero h1 small{display:block;font-size:15px;font-weight:600;letter-spacing:.2em;color:var(--muted);margin-top:2px}
.rhero .tg{margin:14px 0 0;font-size:16px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;padding:3px 11px;border:1px solid color-mix(in srgb,var(--rc) 45%,transparent);color:var(--muted)}

.doc{position:relative;padding:26px 24px 22px;color:var(--paper-ink);background:
  radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.35),transparent 60%),
  radial-gradient(ellipse at 100% 100%,rgba(120,90,40,.18),transparent 60%),
  linear-gradient(180deg,var(--paper),var(--paper2));box-shadow:0 14px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(90,70,30,.25),inset 0 0 40px rgba(120,90,40,.18)}
.doc:before{content:"";position:absolute;inset:7px;border:1px solid rgba(110,85,40,.35);pointer-events:none}
.doc .dh{display:flex;justify-content:space-between;gap:10px;font-family:var(--sans);font-size:10.5px;letter-spacing:.2em;color:var(--paper-dim);border-bottom:1px solid rgba(110,85,40,.35);padding-bottom:8px;margin-bottom:14px}
.doc p{margin:0;font-size:15.5px;line-height:1.95}
.doc .first:first-letter{float:left;font-size:44px;line-height:1;font-weight:900;margin:4px 8px 0 0;color:#5a3f17}

.places{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.place{display:flex;gap:12px;padding:14px 16px;background:var(--bg1);border:1px solid var(--line)}
.place i{flex:none;width:9px;height:9px;margin-top:9px;transform:rotate(45deg);border:1px solid var(--rc);background:color-mix(in srgb,var(--rc) 35%,transparent)}
.place b{display:block;font-size:15px;color:#f4ead0;font-weight:600}
.place span{display:block;font-size:13.5px;color:var(--muted);line-height:1.65;margin-top:2px}
@media (max-width:560px){.places{grid-template-columns:1fr}}
.now{margin:0;padding:0;list-style:none;border-left:1px solid var(--line2)}
.now li{position:relative;padding:8px 0 8px 22px;font-size:15px}
.now li:before{content:"";position:absolute;left:-4px;top:19px;width:7px;height:7px;transform:rotate(45deg);background:var(--bg);border:1px solid var(--gold)}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,160px);gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.hscroll>*{scroll-snap-align:start}
.rnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:40px 0 0}
.rnav a{padding:14px 16px;border:1px solid var(--line);background:var(--bg1);font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:.1em}
.rnav a b{display:block;font-family:var(--serif);font-size:16px;color:#f4ead0;letter-spacing:.06em;margin-top:2px}
.rnav a:last-child{text-align:right}
.sealed-note{margin-top:16px;padding:16px;border:1px dashed rgba(156,124,255,.5);color:#cdbcff;font-size:14px;text-align:center;background:rgba(40,25,80,.2)}

/* ---------- people ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fb{flex:none;font-family:var(--sans);font-size:12.5px;letter-spacing:.1em;padding:7px 14px;border:1px solid var(--line);color:var(--muted);background:var(--bg1);transition:all .2s}
.fb.on{color:#1a1408;background:linear-gradient(145deg,#f3dc8e,#b8963d);border-color:transparent;font-weight:700}
.fb[data-f=rift].on{color:#fff;background:linear-gradient(145deg,#8a5cff,#4b2a8f)}
.count{font-family:var(--sans);font-size:12px;color:var(--dim);letter-spacing:.12em;margin:4px 0 14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:420px){.pgrid{grid-template-columns:1fr 1fr;gap:10px}}
.pc{position:relative;display:block;background:var(--bg1);border:1px solid var(--line);transition:transform .25s,border-color .25s}
.pc:hover{transform:translateY(-3px);border-color:var(--line2)}
.por{position:relative;aspect-ratio:3/4;overflow:hidden;background:
  radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--rc) 40%,transparent),transparent 62%),
  linear-gradient(180deg,#1a2030,#0d1018)}
.por img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.por .crest{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:58%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.por .crest:before{content:"";position:absolute;inset:14%;transform:rotate(45deg);border:1px solid color-mix(in srgb,var(--rc) 75%,#fff 0%)}
.por .crest:after{content:"";position:absolute;inset:24%;transform:rotate(45deg);border:1px solid color-mix(in srgb,var(--rc) 35%,transparent)}
.por .crest span{position:relative;font-size:clamp(26px,7vw,36px);font-weight:900;color:#f4ead0;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.por .no{position:absolute;left:8px;top:7px;font-family:var(--latin);font-size:10px;letter-spacing:.14em;color:var(--gold-hi);text-shadow:0 1px 2px #000}
.por .rib{position:absolute;right:0;top:10px;padding:2px 8px 2px 10px;font-family:var(--sans);font-size:10px;letter-spacing:.14em;color:#1a1408;background:linear-gradient(145deg,#f3dc8e,#b8963d);clip-path:polygon(6px 0,100% 0,100% 100%,6px 100%,0 50%)}
.por:after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(0deg,rgba(11,14,21,.95),transparent)}
.pc .meta{position:relative;padding:9px 11px 11px;border-top:1px solid var(--line)}
.pc .meta b{display:block;font-size:14.5px;color:#f4ead0;letter-spacing:.02em;line-height:1.35}
.pc .meta small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.pc .bar{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--rc);opacity:.7}
.pc.sealed .por{background:radial-gradient(circle at 50% 40%,rgba(156,124,255,.35),transparent 60%),linear-gradient(180deg,#151026,#09070f)}
.pc.sealed .crest span{color:#cdbcff}

/* ---------- person page ---------- */
.dossier{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:22px;margin-top:18px;align-items:start}
@media (max-width:720px){.dossier{grid-template-columns:1fr}}
.dossier .por{border:1px solid var(--line2);box-shadow:0 0 0 3px var(--bg),0 0 0 4px rgba(201,169,79,.25),0 16px 34px rgba(0,0,0,.55)}
@media (max-width:720px){.pin em{display:none}.dossier .por{max-width:230px;margin:0 auto;width:100%}}
.dossier .por .crest span{font-size:52px}
.doc h1{margin:0;font-size:clamp(26px,5vw,34px);font-weight:900;letter-spacing:.06em;color:#2a1d0d;line-height:1.3}
.doc .role{margin:4px 0 0;font-family:var(--sans);font-size:13px;letter-spacing:.14em;color:var(--paper-dim)}
.dt{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:18px 0 0;padding:14px 0;border-top:1px solid rgba(110,85,40,.35);border-bottom:1px solid rgba(110,85,40,.35)}
.dt dt{font-family:var(--sans);font-size:11.5px;letter-spacing:.18em;color:var(--paper-dim);padding-top:3px}
.dt dd{margin:0;font-size:15px}
.dsec{margin-top:16px}
.dsec h4{margin:0 0 4px;font-family:var(--sans);font-size:11.5px;letter-spacing:.22em;color:#7a5a24}
.dsec p{font-size:15px;line-height:1.85}
.quote{position:relative;margin-top:20px;padding:16px 18px 16px 42px;background:#1a1610;color:var(--gold-hi);font-size:16px;line-height:1.7}
.quote:before{content:"";position:absolute;left:16px;top:22px;width:10px;height:10px;transform:rotate(45deg);border:1px solid var(--gold)}
.stamp{position:absolute;right:18px;top:62px;transform:rotate(-12deg);padding:6px 12px;border:2px solid rgba(179,53,42,.75);color:rgba(179,53,42,.85);font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.3em;mix-blend-mode:multiply}
.stamp.gold{border-color:rgba(140,100,30,.7);color:rgba(140,100,30,.85)}
.redact{display:inline-block;height:14px;background:#2a2218;vertical-align:middle;margin:3px 4px 3px 0}
.pnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px 0 0}
.pnav a{padding:12px 14px;border:1px solid var(--line);background:var(--bg1);font-family:var(--sans);font-size:11.5px;color:var(--muted);letter-spacing:.1em}
.pnav a b{display:block;font-family:var(--serif);font-size:15px;color:#f4ead0;margin-top:2px;letter-spacing:.04em}
.pnav a:last-child{text-align:right}

/* ---------- seals ---------- */
.intro{max-width:560px;margin:0 auto;text-align:center;color:var(--muted);font-size:15px}
.seals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
@media (max-width:560px){.seals{grid-template-columns:1fr 1fr;gap:10px}}
.seal{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 12px 20px;border:1px solid var(--line);background:linear-gradient(170deg,#161b28,#0d1018);min-height:220px;transition:border-color .3s}
.seal:hover{border-color:var(--line2)}
.wax{position:relative;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d4574a,#8e2219 60%,#5a120c);box-shadow:0 4px 10px rgba(0,0,0,.6),inset 0 -3px 6px rgba(0,0,0,.35),inset 0 2px 4px rgba(255,255,255,.18);transition:transform .5s cubic-bezier(.3,1.6,.5,1),filter .5s}
.wax:before{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px solid rgba(255,210,190,.35)}
.wax:after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;transform:rotate(45deg);border:1.5px solid rgba(255,220,200,.6)}
.wax.rift{background:radial-gradient(circle at 35% 30%,#9c7cff,#4b2a8f 60%,#24124a)}
.crack{position:absolute;inset:0;border-radius:50%;opacity:0;transition:opacity .4s .15s;background:
  linear-gradient(62deg,transparent 47%,rgba(20,4,2,.85) 48%,rgba(20,4,2,.85) 50%,transparent 51%),
  linear-gradient(-30deg,transparent 47%,rgba(20,4,2,.75) 48%,rgba(20,4,2,.75) 49.5%,transparent 50.5%)}
.seal .rn{font-family:var(--sans);font-size:12.5px;letter-spacing:.3em;color:var(--gold)}
.seal .st{font-family:var(--sans);font-size:11.5px;letter-spacing:.2em;color:var(--dim)}
.seal .tx{display:none;font-size:14.5px;line-height:1.75;color:var(--ink)}
.seal.open{border-color:rgba(255,106,88,.4);background:linear-gradient(170deg,#21141a,#0f0b10)}
.seal.open .wax{transform:scale(.92) rotate(-8deg);filter:brightness(.85)}
.seal.open .crack{opacity:1}
.seal.open .st{display:none}
.seal.open .tx{display:block;animation:pageIn .6s ease}
.seal.rift .rn{color:#c9a4ff}
.foot-note{margin:30px auto 0;max-width:560px;text-align:center;font-family:var(--sans);font-size:12px;color:var(--dim);letter-spacing:.08em}

footer{max-width:1080px;margin:56px auto 0;padding:22px 16px 30px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-family:var(--sans);font-size:11px;color:var(--dim);letter-spacing:.14em}


/* ---------- painted world map ---------- */
.wmap{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;background:#0c1830}
.wmap img{position:absolute;inset:0;width:100%;height:100%;display:block;filter:saturate(.88) contrast(.97) brightness(.96)}
.wmap:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px rgba(5,8,15,.65)}
.wmap svg{position:absolute;inset:0;width:100%;height:100%}
.rp{fill:rgba(255,230,160,0);stroke:none;cursor:pointer;transition:fill .25s}
.rp.hov{fill:rgba(255,228,150,.20);stroke:rgba(255,214,107,.95);stroke-width:5}
.rp[data-r=rift].hov{fill:rgba(170,120,255,.16);stroke:rgba(200,160,255,.9)}
.bd0{fill:none;stroke:rgba(10,10,20,.45);stroke-width:7;stroke-linecap:round;pointer-events:none}
.bd{fill:none;stroke:rgba(255,236,180,.85);stroke-width:3;stroke-dasharray:14 11;stroke-linecap:round;pointer-events:none}
.ml{position:absolute;transform:translate(-50%,-50%);pointer-events:none;text-align:center;white-space:nowrap}
.ml.big{padding:4px 12px 5px;background:linear-gradient(180deg,rgba(14,17,26,.86),rgba(9,11,18,.82));border:1px solid rgba(201,169,79,.75);box-shadow:0 0 0 2px rgba(9,11,18,.5),0 4px 12px rgba(0,0,0,.5);transition:transform .25s,border-color .25s}
.ml.big:before,.ml.big:after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;transform:rotate(45deg);background:var(--gold)}
.ml.big:before{left:-4px}.ml.big:after{right:-4px}
.ml.big b{display:block;font-family:var(--serif);font-weight:900;font-size:clamp(11px,1.8vw,20px);letter-spacing:.3em;margin-right:-.3em;line-height:1.2;color:#f8eccb}
.ml.big small{display:block;font-family:var(--serif);font-weight:600;font-size:clamp(8px,1vw,11.5px);letter-spacing:.16em;color:var(--gold-hi);margin-top:1px}
.ml.big.hov{transform:translate(-50%,-50%) scale(1.07);border-color:var(--gold-hi)}
.ml.big.rift{border-color:rgba(190,150,255,.8);background:rgba(25,12,45,.85)}
.ml.big.rift:before,.ml.big.rift:after{background:#b48cff}
.ml.big.rift{padding:14px 9px 12px}
.ml.big.rift b{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.28em;margin:0;padding:0 0 .1em;line-height:1.3;color:#ecdcff;text-shadow:0 0 8px #8a4dff}
.ml.sm{font-family:var(--sans);font-weight:700;font-size:clamp(7.5px,.95vw,11.5px);letter-spacing:.05em;color:#fff3d6;padding:1px 7px 2px;background:rgba(12,14,22,.66);border-radius:2px;text-shadow:0 1px 2px #000}
.ml.sm.wt{color:#bfe6ff}
.ml.sm.dk{color:#d9c8ff;background:rgba(30,14,50,.7)}
.mpin{position:absolute;pointer-events:none}
.mpin b{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffcf4d);box-shadow:0 0 12px 4px rgba(255,190,60,.95)}
.mpin s{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,214,107,.95);animation:ping 2.6s ease-out infinite}
.mpin em{position:absolute;left:-12px;top:-36px;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-family:var(--sans);font-weight:700;font-size:clamp(8.5px,1vw,11.5px);color:#1a1408;letter-spacing:.08em;padding:2px 8px;background:linear-gradient(145deg,#f3dc8e,#c9a94f);box-shadow:0 2px 6px rgba(0,0,0,.5)}
@media (max-width:640px){.ml.sm{display:none}.ml.big small{display:none}.ml.big{padding:2px 8px 3px}.mpin em{display:none}.ml.big.rift{padding:8px 4px 7px}.ml.big.rift b{font-size:10px;letter-spacing:.2em}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const colorOf = k => (REGIONS[k] && REGIONS[k].color) || AFF_COLOR[k] || '#c9a94f';
const P = PEOPLE.map(a => ({no:a[0],name:a[1],sex:a[2],age:a[3],aff:a[4],group:a[5],role:a[6],look:a[7],pers:a[8],known:a[9],quote:a[10],main:!!a[11],sealed:!!a[12]}));
const pad = n => String(n).padStart(2,'0');
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function portrait(p, big){
  const init = p.sealed ? '?' : p.name.charAt(0);
  return `<div class="por" style="--rc:${colorOf(p.aff)}">
    ${p.sealed ? '' : `<img src="img/${pad(p.no)}.png" alt="" loading="lazy" onerror="this.remove()">`}
    <div class="crest"><span>${init}</span></div>
    <span class="no" translate="no">No.${pad(p.no)}</span>
    ${p.main && !big ? '<span class="rib">주요</span>' : ''}
  </div>`;
}
function card(p){
  return `<a class="pc${p.sealed?' sealed':''}" href="#/person/${p.no}" style="--rc:${colorOf(p.aff)}">
    ${portrait(p)}
    <div class="meta"><b>${esc(p.name)}</b><small>${esc(p.sealed ? '봉인된 기록' : p.role)}</small></div>
    <span class="bar"></span></a>`;
}
function secHead(n, t, more){
  return `<div class="sh"><span class="n" translate="no">${n}</span><h2>${t}</h2><span class="ln"></span>${more||''}</div>`;
}

/* ---------- views ---------- */

    </section>
    <section class="sec">
      ${secHead('III','정세')}
      <ul class="now">${r.now.map(n=>`<li>${n}</li>`).join('')}</ul>
    </section>
    <section class="sec">
      ${secHead('IV','인물', `<a class="more" href="#/people?f=${k}">전체 보기</a>`)}

      ${r.sealed ? '<div class="sealed-note">이 지역의 인물 기록은 이야기 속에서만 열립니다.</div>' : ''}

    <nav class="rnav">

const FILTERS = [['all','전체'],['main','주요'],['north','북부'],['capital','황도'],['temple','교단'],['tower','마탑'],['south','남부'],['east','동부'],['west','서부'],['rift','균열 너머']];
function viewPeople(f){
  f = FILTERS.some(x=>x[0]===f) ? f : 'all';
  const list = P.filter(p => f==='all' ? true : f==='main' ? p.main : p.aff===f);
  return `<div class="page">
    <section class="sec" style="margin-top:28px">
      ${secHead('PERSONAE','인물 도감')}
      <div class="filters">${FILTERS.map(x=>`<button class="fb${x[0]===f?' on':''}" data-f="${x[0]}">${x[1]}</button>`).join('')}</div>
      <div class="count">${list.length}명의 기록</div>
      <div class="pgrid">${list.map(card).join('')}</div>
    </section>
  </div>`;
}

function viewPerson(no){
  const idx = P.findIndex(p => p.no===+no); if(idx<0) return viewPeople('all');

  const red = w => `<span class="redact" style="width:${w}%"></span>`;
  const body = p.sealed ? `
      <h1>???</h1><p class="role">봉인된 기록 · ${affName}</p>
      <dl class="dt"><dt>소속</dt><dd>${red(40)}</dd><dt>직위</dt><dd>${red(55)}</dd><dt>나이</dt><dd>${red(20)}</dd></dl>

      <span class="stamp">열람 제한</span>` : `

      <div class="dsec"><h4>외형</h4><p>${esc(p.look)}</p></div>

      <div class="dsec"><h4>알려진 사실</h4><p>${esc(p.known)}</p></div>

function viewSeals(){

      <p class="intro">이 제국에는 지워진 문장이 여섯 개 있다.<br>권역마다 하나씩, 누군가 그것을 쥐고 있다.</p>

          <span class="rn">${r.name}</span>

/* ---------- router ---------- */
function mountMap(){
  const slot = document.getElementById('mapslot'); if(!slot) return;
  slot.appendChild(document.getElementById('mapTpl').content.cloneNode(true));
  const set = (k,on) => slot.querySelectorAll(`[data-r="${k}"]`).forEach(x=>x.classList.toggle('hov',on));
  slot.querySelectorAll('.rp').forEach(el => {
    const k = el.dataset.r;
    el.addEventListener('click', () => location.hash = '#/region/' + k);
    el.addEventListener('mouseenter', () => set(k,true));
    el.addEventListener('mouseleave', () => set(k,false));
  });
}
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const seg = path.split('/');
  const q = new URLSearchParams(qs||'');
  let html, tab = 'home';
  if(seg[0]==='region') html = viewRegion(seg[1]);
  else if(seg[0]==='people'){ html = viewPeople(q.get('f')||'all'); tab='people'; }
  else if(seg[0]==='person'){ html = viewPerson(seg[1]); tab='people'; }
  else if(seg[0]==='seals'){ html = viewSeals(); tab='seals'; }
  else html = viewHome();
  app.innerHTML = html;
  document.querySelectorAll('[data-t]').forEach(a => a.classList.toggle('on', a.dataset.t===tab));
  mountMap();
  app.querySelectorAll('.fb').forEach(b => b.addEventListener('click', () => {
    const f = b.dataset.f; history.replaceState(null,'', '#/people' + (f==='all'?'':'?f='+f)); route.keepScroll=true; route(); route.keepScroll=false;
  }));
  app.querySelectorAll('.seal').forEach(s => s.addEventListener('click', () => {
    const o = s.classList.toggle('open'); s.setAttribute('aria-expanded', o);
  }));
  if(!route.keepScroll) window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
</script>
